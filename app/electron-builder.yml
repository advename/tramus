appId: org.tramus.app
productName: Tramus
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/engine
    to: engine
    filter:
      - '**/*'
asarUnpack:
  - resources/engine/**
mac:
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.education
  icon: build/icon.icns
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch:
        - x64
  category: Science
npmRebuild: false
