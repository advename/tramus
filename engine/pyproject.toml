[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tramus-engine"
version = "0.1.0"
description = "Tracking and zone-analysis engine for Tramus, a mouse-tracking desktop app."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "av>=14",
  "opencv-python-headless>=4.10",
  "numpy>=2.0",
  "pydantic>=2.9",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "xlsxwriter>=3.2",
  "platformdirs>=4.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.8",
]
build = [
  "pyinstaller>=6.11",
]

[project.scripts]
tramus-engine = "tramus_engine.cli:main"

# Third-party trackers register themselves here, e.g.
# [project.entry-points."tramus.trackers"]
# deeplabcut = "tramus_dlc:DeepLabCutTracker"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
